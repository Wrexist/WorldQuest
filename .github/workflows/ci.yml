name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Generate tokens and translation keys
        run: pnpm generate

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Dependency security
        run: pnpm security:check

      - name: Verify
        run: pnpm verify:full

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.os }}
          path: node_modules/.cache/wq-e2e-shots
          if-no-files-found: ignore

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.os }}
          path: node_modules/.cache/security-report.json
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.114.0 }

      - run: pnpm install --frozen-lockfile

      - name: Build the edge function bundle
        run: pnpm edge:build

      - name: Start Supabase
        run: supabase start

      - name: Migrations apply from empty
        run: supabase db reset

      - name: RLS policy tests
        run: supabase test db

      - name: Generated database types are up to date
        run: |
          pnpm db:types
          if ! git diff --quiet packages/api/src/database.types.ts; then
            echo "::error::database.types.ts is stale — run pnpm db:types and commit."
            echo "The generated file differs as follows (committed → generated):"
            git --no-pager diff packages/api/src/database.types.ts
            exit 1
          fi
