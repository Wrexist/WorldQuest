name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # ── generated artefacts ──────────────────────────────────────────────
      #
      # `tokens.ts`, `tokens.css` and `keys.ts` are untracked and rebuilt here from
      # `tokens.json` and `locales/`. They cannot be stale, so there is nothing to
      # check — the earlier `git diff --exit-code` on them passed unconditionally,
      # because git does not diff files it is not tracking.
      #
      # `database.types.ts` IS tracked, because generating it needs a running
      # Postgres that this job does not have. Its freshness is checked in the
      # `database` job below, where the diff has something to compare against.
      - name: Generate tokens and translation keys
        run: pnpm generate

      - name: Typecheck (packages + app)
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Content validation
        run: pnpm content:validate

      - name: Localisation
        run: pnpm i18n:check

      - name: Contrast (WCAG 2.2 AA)
        run: pnpm design:contrast

      # The economy simulation exits non-zero on its own health gates — a heart
      # block rate over 15%, a hoarding cohort, a curve that tops out early. A
      # reward number can be changed without any test noticing; this notices.
      - name: Economy health
        run: pnpm engines:simulate

  # ── the two checks that need more than Node ────────────────────────────────

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - run: pnpm install --frozen-lockfile

      # Against a LOCAL stack, never a hosted project. A migration that drops a
      # column is a migration that drops a column, and CI must be free to find
      # that out.
      - name: Start Supabase
        run: supabase start

      # Every migration applied from scratch. Catches the class of bug where a
      # migration only works against the schema that happens to be in staging.
      - name: Migrations apply from empty
        run: supabase db reset

      # RLS is the entire authorisation model. A policy that is missing, or that
      # is written to `USING (true)`, lets one user read another's progress — and
      # nothing else in this pipeline would notice.
      - name: RLS policy tests
        run: supabase test db

      - name: Generated database types are up to date
        run: |
          supabase gen types typescript --local > packages/api/src/database.types.ts
          git diff --exit-code packages/api/src/database.types.ts \
            || (echo "::error::database.types.ts is stale — run pnpm db:types and commit"; exit 1)

# The edge function VENDORS the grading, FSRS and balance modules, because Deno
# cannot import from a pnpm workspace. Vendored code drifts silently, and the
# result is a client and a server that disagree about what a user knows — the
# worst bug this product can have.
#
# There is deliberately NO job for it here. The bundle is assembled in memory at
# deploy time and never written to the repo, so a `git diff` check would pass
# unconditionally and prove nothing. The real guard is
# `supabase/functions/build.test.ts`, which asserts the vendored grading, FSRS
# and balance modules are byte-identical to their source — and that runs in
# `pnpm test` above.
