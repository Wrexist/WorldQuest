name: Native acceptance

on:
  workflow_dispatch:
    inputs:
      ios_only:
        description: 'Retry iOS acceptance using an already verified Android revision'
        type: boolean
        default: false
      asset_diagnostics:
        description: 'Trace first-render image sources and native load dimensions'
        type: boolean
        default: false
      link_diagnostics:
        description: 'Trace the synthetic country deep link in the simulator build'
        type: boolean
        default: false
      atlas_diagnostics:
        description: 'Trace native globe layout, drawing buffers and framebuffer pixels'
        type: boolean
        default: false
  push:
    branches: ['fix/**']
    paths: ['.github/workflows/native-acceptance.yml']

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ !inputs.ios_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worldquest/mobile exec expo prebuild --platform android --no-install
      - name: Compile bundled emulator APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs=-Xmx4g
      - uses: actions/upload-artifact@v4
        with:
          name: android-emulator-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require one diagnostic mode at a time
        if: ${{ (inputs.asset_diagnostics && inputs.link_diagnostics) || (inputs.asset_diagnostics && inputs.atlas_diagnostics) || (inputs.link_diagnostics && inputs.atlas_diagnostics) }}
        run: |
          echo "::error::Choose at most one of asset_diagnostics, link_diagnostics or atlas_diagnostics"
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: pnpm install --frozen-lockfile
      - name: Add first-render image lifecycle diagnostic
        if: ${{ inputs.asset_diagnostics }}
        run: node scripts/native-image-lifecycle-diagnostic.cjs
      - name: Add deep link diagnostic to the simulator entry
        if: ${{ inputs.link_diagnostics }}
        run: node scripts/native-link-diagnostic.cjs entry
      - name: Add native globe drawing diagnostic
        if: ${{ inputs.atlas_diagnostics }}
        run: node scripts/native-atlas-diagnostic.cjs
      - run: pnpm --filter @worldquest/mobile exec expo prebuild --platform ios --no-install
      - name: Trace the generated native URL callback
        if: ${{ inputs.link_diagnostics }}
        run: node scripts/native-link-diagnostic.cjs native
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile unsigned simulator application
        run: |
          set -o pipefail
          xcodebuild -workspace apps/mobile/ios/WorldQuest.xcworkspace -scheme WorldQuest -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/wq-ios" CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Preserve the simulator application for inspection
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/wq-ios/Build/Products/Release-iphonesimulator/WorldQuest.app" "$RUNNER_TEMP/ios-simulator-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/ios-simulator-app.zip
          retention-days: 7
      - name: Launch and capture simulator
        env:
          IMAGE_DIAGNOSTICS: ${{ inputs.asset_diagnostics }}
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/wq-ios/Build/Products/Release-iphonesimulator/WorldQuest.app"
          xcrun simctl launch "$DEVICE_ID" com.wrexist.worldquest
          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-startup.png"
          if [ "$IMAGE_DIAGNOSTICS" = "true" ]; then
            APP_DATA_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.wrexist.worldquest data)
            cp "$APP_DATA_CONTAINER/Documents/native-image-lifecycle-diagnostic.json" "$RUNNER_TEMP/native-image-first-launch.json"
          fi
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep com.wrexist.worldquest
          xcrun simctl terminate "$DEVICE_ID" com.wrexist.worldquest
          # A second fresh install exercises startup without retained app storage.
          # Maestro separately verifies a normal terminate/relaunch after onboarding.
          xcrun simctl uninstall "$DEVICE_ID" com.wrexist.worldquest
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/wq-ios/Build/Products/Release-iphonesimulator/WorldQuest.app"
          xcrun simctl launch "$DEVICE_ID" com.wrexist.worldquest
          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-second-startup.png"
          if [ "$IMAGE_DIAGNOSTICS" = "true" ]; then
            APP_DATA_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.wrexist.worldquest data)
            cp "$APP_DATA_CONTAINER/Documents/native-image-lifecycle-diagnostic.json" "$RUNNER_TEMP/native-image-second-launch.json"
          fi
      - name: Exercise native storage, navigation and decoding
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro"
          cd "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 -o maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          echo '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  maestro.zip' | shasum -a 256 --check
          unzip -q maestro.zip
          export PATH="$RUNNER_TEMP/maestro/maestro/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          maestro --device "$DEVICE_ID" test --debug-output "$RUNNER_TEMP/native-flow" apps/mobile/e2e/native-smoke.yaml
      - name: Verify rendered native globe zoom
        if: always()
        run: |
          node --test scripts/verify-native-globe-zoom.test.cjs
          node scripts/verify-native-globe-zoom.cjs "$RUNNER_TEMP/native-flow" "$RUNNER_TEMP/native-globe-zoom.json"
      - name: Collect native deep link diagnostic
        if: ${{ always() && inputs.link_diagnostics }}
        run: |
          set -euo pipefail
          if [ -n "${DEVICE_ID:-}" ]; then
            if APP_DATA_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.wrexist.worldquest data); then
              if [ -f "$APP_DATA_CONTAINER/Documents/native-link-diagnostic.json" ]; then
                cp "$APP_DATA_CONTAINER/Documents/native-link-diagnostic.json" "$RUNNER_TEMP/native-link-diagnostic.json"
              else
                echo "::warning::Native deep link diagnostic report was not written"
              fi
            fi
          fi
      - name: Collect native globe drawing diagnostic
        if: ${{ always() && inputs.atlas_diagnostics }}
        run: |
          set -euo pipefail
          if [ -n "${DEVICE_ID:-}" ]; then
            if APP_DATA_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" com.wrexist.worldquest data); then
              if [ -f "$APP_DATA_CONTAINER/Documents/native-atlas-diagnostic.json" ]; then
                cp "$APP_DATA_CONTAINER/Documents/native-atlas-diagnostic.json" "$RUNNER_TEMP/native-atlas-diagnostic.json"
              else
                echo "::warning::Native globe diagnostic report was not written"
              fi
              if [ -f "$APP_DATA_CONTAINER/Documents/native-atlas-native.jsonl" ]; then
                cp "$APP_DATA_CONTAINER/Documents/native-atlas-native.jsonl" "$RUNNER_TEMP/native-atlas-native.jsonl"
              else
                echo "::warning::Native globe lifecycle trace was not written"
              fi
              shopt -s nullglob
              for FRAME_PATH in "$APP_DATA_CONTAINER/Documents"/native-atlas-frame-*.png; do
                cp "$FRAME_PATH" "$RUNNER_TEMP/"
              done
            fi
          fi
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-startup.png
            ${{ runner.temp }}/ios-second-startup.png
            ${{ runner.temp }}/native-image-first-launch.json
            ${{ runner.temp }}/native-image-second-launch.json
            ${{ runner.temp }}/native-link-diagnostic.json
            ${{ runner.temp }}/native-atlas-diagnostic.json
            ${{ runner.temp }}/native-atlas-native.jsonl
            ${{ runner.temp }}/native-atlas-frame-*.png
            ${{ runner.temp }}/native-globe-zoom.json
            ${{ runner.temp }}/native-flow/
            apps/mobile/ios/WorldQuest/AppDelegate.swift
            apps/mobile/native-link-diagnostic-AppDelegate.original.swift
            apps/mobile/native-atlas-diagnostic-GLView.original.swift
            node_modules/expo-gl/ios/GLView.swift
            native-relaunch.png
            native-country-se.png
            native-country-warm-fr.png
            native-daily-goal.png
            native-region.png
            native-first-lesson.png
            native-optional-study.png
            native-explore-globe.png
            native-explore-zoomed.png
          if-no-files-found: ignore
          retention-days: 7
