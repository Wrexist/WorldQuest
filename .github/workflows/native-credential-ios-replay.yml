name: iOS credential proof replay
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Native credential run containing the compiled iOS proof'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: credential-ios-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install the recorded Xcode-signed simulator proof
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BUILD_RUN" --name credential-evidence-ios --dir "$RUNNER_TEMP/recorded"
          ZIP=$(find "$RUNNER_TEMP/recorded" -name credential-ios-app.zip -print -quit)
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proof"
          APP="$RUNNER_TEMP/proof/WorldQuestCredentialProof.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = com.wrexist.worldquest.credentialsproof
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP" > "$RUNNER_TEMP/credential-signed-entitlements.plist"
          echo "Native binary and JavaScript: $(gh run view "$BUILD_RUN" --json headSha --jq .headSha); no rebundling" >> "$GITHUB_STEP_SUMMARY"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP"
      - name: Install pinned Maestro
        run: |
          mkdir -p "$RUNNER_TEMP/maestro" && cd "$RUNNER_TEMP/maestro"
          curl --fail --location --retry 3 -o maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          echo '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  maestro.zip' | shasum -a 256 --check
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Verify migration, restart, logout and reinstall
        run: |
          set -euo pipefail
          maestro --device "$DEVICE_ID" test --debug-output "$RUNNER_TEMP/credential-restart" scripts/native-credentials/restart.yaml
          xcrun simctl uninstall "$DEVICE_ID" com.wrexist.worldquest.credentialsproof
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/proof/WorldQuestCredentialProof.app"
          maestro --device "$DEVICE_ID" test --debug-output "$RUNNER_TEMP/credential-reinstall" scripts/native-credentials/reinstall.yaml
      - name: Capture final state
        if: always() && env.DEVICE_ID != ''
        run: xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/credential-ios-final.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-ios-signed-evidence
          path: |
            ${{ runner.temp }}/credential-signed-entitlements.plist
            ${{ runner.temp }}/credential-ios-final.png
            ${{ runner.temp }}/credential-restart/
            ${{ runner.temp }}/credential-reinstall/
          include-hidden-files: true
          retention-days: 7
