appId: com.wrexist.worldquest
---
# Fresh simulator only. Covers the native dependency paths carried in E18.
- launchApp
- tapOn:
    text: "Get started"
    retryTapIfNoChange: true
- tapOn: "English"
- assertVisible: "Explore countries"
- tapOn: "Next"
- assertVisible: "Practice daily"
- tapOn: "Next"
- assertVisible: "Your world"
- tapOn: "Continue"
- scrollUntilVisible:
    element: "2002"
    direction: DOWN
    timeout: 30000
- tapOn: "2002"
- tapOn: "Continue"
- assertVisible: "10 min.*"
- takeScreenshot: native-daily-goal
- tapOn: "Continue"
- tapOn: "Europe"
- takeScreenshot: native-region
- tapOn: "Continue"
- assertVisible: "How well do you know the world?"
- tapOn: "Continue"
- assertVisible: "Here is your plan."
- tapOn: "Continue"
- tapOn: "Start learning"
- assertVisible:
    id: "lesson-check"
- assertNotVisible:
    id: "lesson-introduction"
- takeScreenshot: native-first-lesson
- tapOn:
    id: "lesson-study"
- assertVisible:
    id: "lesson-introduction"
- assertVisible: "Learn first"
- takeScreenshot: native-optional-study
- tapOn:
    id: "lesson-begin"
- assertVisible:
    id: "lesson-check"
- tapOn: "Pause the lesson"
- tapOn: "Finish here"
- tapOn: "Continue"
# An early finish returns to the assigned course without a profile offer.
- assertVisible:
    id: "path-node-current"
- stopApp
- launchApp
- assertVisible:
    id: "path-node-current"
- takeScreenshot: native-relaunch
- tapOn: "Explore"
# Zoom controls exist only after the native renderer reports ready.
- extendedWaitUntil:
    visible: "Zoom in"
    timeout: 30000
# The native accessibility tree includes controls under the fixed tab bar. Centre the
# whole globe in the scroll viewport before capturing or physically tapping zoom.
- scrollUntilVisible:
    element:
      id: "explore-globe"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "explore-globe"
- assertNotVisible:
    id: "atlas-fallback"
- assertNotVisible:
    id: "explore-map-fallback"
- takeScreenshot: native-explore-globe
- tapOn: "Zoom in"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: "Zoom out"
- assertVisible:
    id: "explore-globe"
- assertNotVisible:
    id: "atlas-fallback"
- assertNotVisible:
    id: "explore-map-fallback"
- takeScreenshot: native-explore-zoomed
# Start the first link from a stopped app, as in Maestro's deep-link recipe.
- stopApp
- openLink: "worldquest://country/%53%45"
# Consent may appear asynchronously, or the OS may open the destination directly.
- extendedWaitUntil:
    visible: "^(Open|Sweden)$"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn:
          text: "Open"
          retryTapIfNoChange: true
- assertVisible: "Sweden"
- assertVisible: "Practise this country"
- takeScreenshot: native-country-se
# Keep the process running to verify a second encoded link replaces the country.
- openLink: "worldquest://country/%46%52"
- extendedWaitUntil:
    visible: "^(Open|France)$"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
      visible: "Open"
    commands:
      - tapOn:
          text: "Open"
          retryTapIfNoChange: true
- assertVisible: "France"
- assertVisible: "Practise this country"
- takeScreenshot: native-country-warm-fr
