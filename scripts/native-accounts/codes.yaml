appId: com.wrexist.worldquest.accountsproof
---
# Eight-digit code lifecycle on a real device: resend bounds, expiry, and what an
# ended session does. Runs after ui.yaml, which deleted its account; a relaunch
# re-reads the stored UI flag and starts from an empty account.
- stopApp
- launchApp
# Cold start plus the URL handoff the previous flow left behind; see the timeout
# note in reinstall.yaml.
- extendedWaitUntil:
    visible: Start as guest
    timeout: 300000
- tapOn: Start as guest
- tapOn: Link your email
- tapOn: Birth year
- inputText: '2000'
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- tapOn: Continue
- tapOn: Email
- inputText: native-proof@example.invalid
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- tapOn: Send me a code
- extendedWaitUntil:
    visible: Eight-digit code
    timeout: 30000
# The countdown is the client's copy, and while it runs the Resend button is
# disabled — a tap would never reach the server. So wait the client's floor out,
# then restart the server's own floor and tap. That asserts the rule that matters:
# the server refuses an early resend even when the device believes the floor has
# passed, and the screen shows the rate error rather than a success.
- assertVisible: 'Resend available in .*'
- extendedWaitUntil:
    notVisible: 'Resend available in .*'
    timeout: 120000
- runScript: recent-send.js
- tapOn: Resend code
- extendedWaitUntil:
    visible: 'Please wait before trying again. If the code has expired, request a new one.'
    timeout: 30000
- takeScreenshot: codes-resend-refused
# A code past its five minutes is refused even though the device still holds it.
- runScript: expire-challenge.js
- runScript: mailbox.js
- tapOn: Eight-digit code
- inputText: ${output.code}
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- tapOn: Confirm
- extendedWaitUntil:
    visible: 'That code is invalid or expired. Check the code, or request a new one when its time runs out.'
    timeout: 30000
- takeScreenshot: codes-expired
# An ended session opens the recovery choice, and says where local progress stays,
# instead of quietly resetting the account.
- runScript: expire-session.js
- tapOn: Confirm
- extendedWaitUntil:
    visible: Sign in again
    timeout: 30000
- assertVisible: 'Your session has ended. Your local progress stays with its original account while you choose what to do.'
- assertVisible: Recover with email
- takeScreenshot: codes-recovery
- tapOn: Recover with email
- extendedWaitUntil:
    visible: Your year of birth
    timeout: 30000
- takeScreenshot: codes-recovered
# A younger user reaches the age step through a route that already asked for a
# login, and still gets no email field. The API half of this is asserted in
# probe.tsx against the same synthetic server; this is the screen half.
- tapOn: Birth year
- inputText: '2016'
- runFlow:
    when:
      platform: android
    commands:
      - hideKeyboard
- tapOn: Continue
- extendedWaitUntil:
    visible: Keep learning as a guest
    timeout: 30000
- assertVisible: 'Email accounts are unavailable for your age group. You can keep learning without sharing an email address.'
# The field's placeholder, not the word "Email": the protected body legitimately
# starts with that word, so a negative on it would be meaningless.
- assertNotVisible: you@example.com
- assertNotVisible: Send me a code
- takeScreenshot: codes-protected
