appId: com.wrexist.worldquest.accountsproof
---
- launchApp
- extendedWaitUntil:
    visible: PASS_RENEWAL_READY_RESTART
    timeout: 60000
- takeScreenshot: account-pending
- stopApp
- launchApp
- extendedWaitUntil:
    visible: PASS_RECOVERY_READY_REINSTALL
    timeout: 60000
- takeScreenshot: account-recovery
