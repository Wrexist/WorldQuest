appId: com.wrexist.worldquest.accountsproof
---
# No `hideKeyboard` anywhere below. The birth-year and code fields use a numeric
# keypad, which on iOS has no dismiss key, so Maestro's hideKeyboard fails there
# with the keyboard legitimately on screen. The primary button on every step sits
# above the keypad, so each tap targets the button directly instead.
- runFlow:
    when:
      platform: android
    commands:
      - openLink: worldquestaccountsproof://ui
# Same iOS scheme-handoff prompt as in reinstall.yaml: the app cannot render
# the account screens while the system is still asking whether to open it.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Open'
          optional: true
- extendedWaitUntil:
    visible: Start as guest
    timeout: 120000
- tapOn: Start as guest
- tapOn: Link your email
- tapOn: Birth year
- inputText: '2000'
- tapOn: Continue
- tapOn: Email
- inputText: native-proof@example.invalid
- tapOn: Send me a code
- extendedWaitUntil:
    visible: Eight-digit code
    timeout: 30000
- takeScreenshot: ui-code
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Eight-digit code
    timeout: 60000
- runScript: mailbox.js
- tapOn: Eight-digit code
- inputText: ${output.code}
- tapOn: Confirm
- extendedWaitUntil:
    visible: Your email is linked
    timeout: 30000
- takeScreenshot: ui-linked
- tapOn: Continue
- tapOn: Delete account
- takeScreenshot: ui-delete-confirmation
- tapOn: Send me a code
- extendedWaitUntil:
    visible: Eight-digit code
    timeout: 30000
- runScript: mailbox.js
- tapOn: Eight-digit code
- inputText: ${output.code}
- tapOn: Delete permanently
- extendedWaitUntil:
    visible: Your account is deleted
    timeout: 30000
- takeScreenshot: ui-deleted
