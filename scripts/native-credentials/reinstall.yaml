appId: com.wrexist.worldquest.credentialsproof
---
- openLink: worldquestcredentialsproof://reinstall
- runFlow:
    when:
      platform: ios
      visible: 'Open in .*WorldQuest Credential Proof.*'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: 'PASS_REINSTALL_KEYCHAIN_.*'
    timeout: 60000
- takeScreenshot: credential-reinstall
